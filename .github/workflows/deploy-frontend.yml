name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'kmrl-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kmrl-frontend/package-lock.json

      - name: Install dependencies
        working-directory: kmrl-frontend
        run: npm ci

      - name: Build
        working-directory: kmrl-frontend
        env:
          VITE_API_BASE_URL: https://metgo-backend.onrender.com
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: metgo
          directory: kmrl-frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
