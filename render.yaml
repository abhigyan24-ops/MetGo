services:
  - type: web
    name: metgo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_MODE
        value: render
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: metgo-postgres
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: metgo-postgres
    databaseName: kmrl_db
    user: kmrl
    plan: free
    region: oregon
