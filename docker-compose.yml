version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: metgo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: kmrl_postgres
    environment:
      POSTGRES_USER: kmrl
      POSTGRES_PASSWORD: kmrl_secret
      POSTGRES_DB: kmrl_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmrl -d kmrl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metgo_backend
    environment:
      - DATABASE_URL=postgresql://kmrl:kmrl_secret@postgres:5432/kmrl_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_ALWAYS_EAGER=false
      - NEO4J_URI=bolt://neo4j:7687
      - APP_ENV=development
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metgo_celery
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    environment:
      - DATABASE_URL=postgresql://kmrl:kmrl_secret@postgres:5432/kmrl_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_ALWAYS_EAGER=false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    container_name: kmrl_neo4j
    environment:
      NEO4J_AUTH: neo4j/kmrl_neo4j_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
